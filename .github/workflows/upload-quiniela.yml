          function toFirestore(val) {
            if (typeof val === 'string') return { stringValue: val };
            if (typeof val === 'number') return { integerValue: val };
            if (typeof val === 'boolean') return { booleanValue: val };
            if (val === null) return { nullValue: null };
            if (typeof val === 'object') {
              const fields = {};
              for (const [k, v] of Object.entries(val)) fields[k] = toFirestore(v);
              return { mapValue: { fields } };
            }
            return { stringValue: String(val) };
          }

          function patch(docId, data) {
            return new Promise((res, rej) => {
              const fields = {};
              for (const [k, v] of Object.entries(data)) fields[k] = toFirestore(v);
              const body = JSON.stringify({ fields });
              const req = https.request({
                hostname: 'firestore.googleapis.com',
                path: `/v1/projects/${PROJECT_ID}/databases/(default)/documents/excel_quiniela/${docId}?key=${API_KEY}`,
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>res(d)); });
              req.on('error', rej); req.write(body); req.end();
            });
          }

          (async () => {
            for (const [docId, playerData] of Object.entries(DATA)) {
              try {
                await patch(docId, playerData);
                console.log(`✓ Uploaded ${playerData.name}`);
              } catch(e) {
                console.error(`✗ Failed ${playerData.name}:`, e.message);
              }
            }
            console.log('Done!');
          })();
