                '</div>' +
                '<a href=\"' + link + '\" style=\"display:inline-block;background:#20B2AA;color:#ffffff;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:14px\">⚽ Predict this match</a>' +
