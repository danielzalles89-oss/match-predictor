            }).join('');

            return '<div style=\"font-family:Arial,sans-serif;max-width:500px;margin:0 auto;background:#001254;color:#f0f8ff;padding:24px;border-radius:12px\">' +
              '<h2 style=\"color:#20B2AA;margin:0 0 4px\">⚽ WC 2026 Match Predictor</h2>' +
