              buttons +
              '<p style=\"color:#83BAB5;font-size:12px;margin-top:20px\">🎯 Exact score = 1 pt · ✗ Wrong = 0 pts</p>' +
              '<p style=\"color:#4a7a8a;font-size:11px\">Zalles WC 2026 Match Predictor</p>' +
              '</div>';
          }

          // ── SEND VIA EMAILJS REST API ────────────────────────────
          function sendEmail(player) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                service_id: EMAILJS_SERVICE_ID,
                template_id: EMAILJS_TEMPLATE_ID,
                user_id: EMAILJS_PUBLIC_KEY,
                template_params: {
                  to_email: player.email,
                  email: player.email,
                  subject: '⚽ Predict today\\'s WC matches!',
                  message: buildEmail(player),
                }
              });

              const req = https.request({
                hostname: 'api.emailjs.com',
                path: '/api/v1.0/email/send',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'origin': 'https://match-predictor-khaki.vercel.app',
                }
              }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    console.log('✓ Sent to ' + player.email);
                    resolve();
                  } else {
                    console.error('✗ Failed for ' + player.email + ': ' + data);
                    reject(new Error(data));
                  }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          // ── SEND TO ALL PLAYERS ──────────────────────────────────
          (async () => {
            for (const player of PLAYERS) {
              try {
                await sendEmail(player);
                await new Promise(r => setTimeout(r, 500)); // small delay between sends
              } catch(e) {
                console.error('Failed for', player.email, e.message);
              }
            }
            console.log('Done!');
          })();
