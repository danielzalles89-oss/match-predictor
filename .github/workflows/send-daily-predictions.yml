          // Include matches kicking off today OR early tomorrow (midnight games)
          const todayMatches = ALL_MATCHES.filter(m => {
            const ko = new Date(m.kickoff);
            const d = ko.toISOString().split('T')[0];
            return d === todayUTC || d === tomorrowUTC;
          });

          if (todayMatches.length === 0) {
            console.log('No matches today — skipping email send.');
            process.exit(0);
          }

          console.log('Matches today:', todayMatches.map(m => m.home + ' vs ' + m.away).join(', '));

          // ── BUILD HTML EMAIL ─────────────────────────────────────
          function buildEmail(player) {
            const buttons = todayMatches.map(m => {
              const link = APP_URL + '?match=' + m.id + '&uid=' + player.id + '&name=' + encodeURIComponent(player.name);
              return '<div style=\"margin-bottom:14px;background:#0a1f6e;border-radius:10px;padding:14px 16px;border:1px solid #1a3080\">' +
                '<div style=\"font-size:15px;font-weight:bold;color:#f0f8ff;margin-bottom:10px\">' +
